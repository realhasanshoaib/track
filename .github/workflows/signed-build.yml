name: Signed release builds

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-signed-build
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Restore credentials and build
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: scripts/release/build-signed-android.sh

      - name: Preserve signed Android evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: track-android-signed
          path: build/release/*.aab
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: Signed iOS archive
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: production-signing
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --non-interactive --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile
        run: pod install --project-directory=ios

      - name: Restore credentials and build
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: scripts/release/build-signed-ios.sh
