packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - msw
  - sharp
  - workerd

overrides:
  brace-expansion@<=5.0.8: 5.0.9
  '@hono/node-server@<1.19.15': 1.19.15
  fast-uri@<3.1.5: 3.1.5
  ip-address@<=10.3.0: 10.3.1
  image-size@1.2.1: npm:image-size-next@1.2.2
  js-yaml@>=3.0.0 <3.15.1: 3.15.1
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  nanoid@>=3.0.0 <3.3.18: 3.3.18
  postcss@>=8.0.0 <=8.5.22: 8.5.23
  sharp@<0.35.0: 0.35.3
  undici@>=7.0.0 <7.29.0: 7.29.0
  uuid@<11.1.1: 11.1.1

patchedDependencies:
  brace-expansion@5.0.9: patches/brace-expansion@5.0.9.patch
  expo-modules-core@55.0.25: patches/expo-modules-core@55.0.25.patch
  react-native-reanimated@4.2.1: patches/react-native-reanimated@4.2.1.patch
