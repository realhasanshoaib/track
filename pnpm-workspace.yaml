packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

allowBuilds:
  "@firebase/util": false
  esbuild: true
  lightningcss: true
  msw: true
  protobufjs: false
  sharp: true
  workerd: true

# Convex bundles the Node image action for linux-arm64 even when local
# development runs on the M4 (darwin-arm64) or CI runs on linux-x64. Install
# only the three real deployment hosts needed by this repository.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
    - x64

overrides:
  '@q9labsai/cli': https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-cli-0.3.0.tgz
  '@q9labsai/config-depcruise': https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-config-depcruise-0.3.0.tgz
  '@q9labsai/config-oxlint': https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-config-oxlint-0.3.0.tgz
  '@q9labsai/config-semgrep': https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-config-semgrep-0.3.0.tgz
  '@q9labsai/config-tsconfig': https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-config-tsconfig-0.3.0.tgz
  '@q9labsai/diagnostics': https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-diagnostics-0.3.0.tgz
  '@q9labsai/gates': https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-gates-0.3.0.tgz
  '@xmldom/xmldom@>=0.7.0 <=0.8.14': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <=0.9.11': 0.9.12
  brace-expansion@<=5.0.11: 5.0.12
  '@hono/node-server@<1.19.15': 1.19.15
  browserslist@<=4.28.6: 4.28.7
  decode-uri-component@<=0.4.2: 0.5.0
  fast-uri@<3.1.5: 3.1.5
  ip-address@<=10.3.0: 10.3.1
  image-size@1.2.1: npm:image-size-next@1.2.2
  js-yaml@>=3.0.0 <3.15.2: 3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  nanoid@>=3.0.0 <3.3.18: 3.3.18
  postcss@>=8.0.0 <=8.5.22: 8.5.23
  sharp@<0.35.4: 0.35.4
  undici@>=7.0.0 <7.29.1: 7.29.1
  '@grpc/grpc-js@>=1.14.0 <1.14.5': 1.14.5
  '@fastify/busboy@>=1.0.0 <3.2.1': 3.2.1
  hono@<4.13.7: 4.13.7
  uuid@<11.1.1: 11.1.1

patchedDependencies:
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch
  expo-modules-core@55.0.25: patches/expo-modules-core@55.0.25.patch
  react-native-reanimated@4.2.1: patches/react-native-reanimated@4.2.1.patch

# dependency-cruiser 18 parses TypeScript through the compiler API and does not
# support TypeScript 7 yet. Keep its parser-only TypeScript isolated from the
# repository compiler used by the application packages.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3

# Allow q9stack GitHub release tarballs until they are published to npm.
blockExoticSubdeps: false

audit:
  ignore:
    # No patched release as of 2026-10-04; Metro build-time path; remove when a fix ships.
    - GHSA-vfj7-8cjw-p6xm
    # No patched release as of 2026-10-04; @expo/cli build-time path; remove when a fix ships.
    - GHSA-86w9-cpqp-85rv
