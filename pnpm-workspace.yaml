packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
verifyDepsBeforeRun: false

# Convex bundles the Node image action for linux-arm64 even when local
# development runs on the M4 (darwin-arm64) or CI runs on linux-x64. Install
# only the three real deployment hosts needed by this repository.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
    - x64

overrides:
  hono: 4.13.12
  # Keep the workspace on one React version; React Native 0.86 accepts ^19.2.3.
  react: 19.2.7
  react-dom: 19.2.7
  '@xmldom/xmldom@>=0.7.0 <=0.8.14': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <=0.9.11': 0.9.12
  brace-expansion@<=5.0.11: 5.0.12
  '@grpc/grpc-js@>=1.14.0 <1.14.5': 1.14.5
  '@grpc/grpc-js@<1.13.6': 1.13.6
  moment@<2.31.0: 2.31.0
  browserslist@<=4.28.6: 4.28.7
  decode-uri-component@<=0.4.2: 0.5.0
  '@hono/node-server@<1.19.15': 1.19.15
  '@fastify/busboy@<3.2.2': 3.2.2
  compression@<1.8.2: 1.8.2
  fast-uri@<3.1.5: 3.1.5
  ip-address@<=10.3.0: 10.3.1
  image-size@1.2.1: npm:image-size-next@1.2.2
  js-yaml@>=3.0.0 <3.15.2: 3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  nanoid@>=3.0.0 <3.3.18: 3.3.18
  postcss@>=8.0.0 <=8.5.22: 8.5.23
  sharp@<0.35.5: 0.35.5
  seroval@>=0.12.0 <=1.6.2: 1.6.8
  source-map-js@<1.2.2: 1.2.2
  shell-quote@<1.11.0: 1.12.0
  undici@>=7.0.0 <7.29.1: 7.29.1
  uuid@<11.1.1: 11.1.1

patchedDependencies:
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch
  expo-modules-core@57.0.19: patches/expo-modules-core@57.0.19.patch
  react-native@0.86.3: patches/react-native@0.86.3.patch

# dependency-cruiser 18 parses TypeScript through the compiler API and does not
# support TypeScript 7 yet. Keep its parser-only TypeScript isolated from the
# repository compiler used by the application packages.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3

allowBuilds:
  '@firebase/util': false
  esbuild: true
  lightningcss: true
  msw: true
  protobufjs: false
  sharp: true
  workerd: true
