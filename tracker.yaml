        from: [ARCH-05]

  - id: release.repeatable_browser_journeys
    title: The real client and isolated backend pass representative journeys repeatably
    area: release
    state: unknown
    priority: P1
    size: Unknown
    size_reason: Reproduce on the current source before separating fixture, auth, and application work.
    summary: >-
      The real-client Playwright harness and journeys exist. Earlier audit runs were mixed;
      current repeatability was not established by this documentation pass or by unit tests.
    uncertainty: >-
      The September audit recorded one complete pass and a later task-detail timeout with local
      Convex query/recovery failures. That is not proof of a dirty-draft defect or a current
      production failure. Reassess against the current auth and fixture source.
    remaining:
      - Run pnpm e2e against the isolated local backend and retain traces for any failure.
      - Fix the reproduced cause without replacing the app with an imitation UI or weakening checks.
      - Record a repeatably green run and its exact revision before closing this outcome.
    theory: theory.md#tasks-and-evidence
    code:
      - e2e/playwright.config.ts
      - e2e/tests/track-journeys.spec.ts
      - e2e/tests/task-editing.spec.ts
      - scripts/e2e/run-local-stack.mjs
    evidence:
      - kind: prior_assessment
        from: [ARCH-06]
        detail: Preserve the unresolved acceptance question; do not carry old failure observations forward as current facts.

  - id: release.measured_runtime_baseline
    title: Performance decisions use valid, comparable measurements of real user operations
    area: release
    state: unknown
    priority: P2
    size: Unknown
    size_reason: Establish fixture readiness and a valid baseline before estimating performance changes.
    summary: >-
      Browser-operation and production-bundle collectors have checked budgets. The earlier audit
      had passing bundle measurements but no valid runtime baseline after fixture readiness
      stalled. This entry does not assert that the product is slow.
    uncertainty: >-
      Current route, send, and scroll performance needs a successful collector run. Unit tests
      and generated bundle size cannot establish those runtime outcomes or a speedup.
    remaining:
      - Run pnpm perf:fixture only against the guarded local fixture; preserve a valid current report.
      - >-
        Keep readiness and scrolling real. Do not relax thresholds to make a stalled collector
        appear successful. Inspect e2e/performance/budgets.json for the maintained budgets.
      - >-
        Run pnpm perf:build after the web build for output-size evidence. Label fixture timings
        as local observations, not production field measurements, database counts, or subscription counts.
    theory: theory.md#scope-and-tradeoffs
    code:
      - e2e/tests/performance.spec.mjs
      - e2e/performance/budgets.json
      - scripts/perf/measure-web-build.mjs
    evidence:
      - kind: prior_assessment
        from: [ARCH-07]

  - id: release.completed_code_review
    title: The approved reliability changes receive a completed independent code-review verdict
    area: release
    state: unknown
    priority: P1
    size: Unknown
    size_reason: Review completion and any resulting work are unknown until the applicable handoff.
    summary: >-
      The prior audit's required CLI review timed out without a verdict. Static checks and
      successful builds do not substitute for that review, and this docs-only pass did not rerun it.
    uncertainty: The earlier review is incomplete; no current code-review signoff is claimed here.
    remaining:
      - Complete review at the next applicable code handoff under the one-run-per-handoff protocol.
      - Verify material findings against current source and record the outcome; do not invent findings from the timeout.
    code:
      - convex
      - apps/web/src
      - apps/mobile/src
