    state: working
    summary: >-
      Message retries preserve identity and successful upload work. Server-side upload intents
      bind author, destination, and represented membership. Assistant retries do not resend the
      human message. These contracts have automated coverage; they are not a device-network survey.
    theory: theory.md#tasks-and-evidence
    code:
      - convex/messages.ts
      - convex/lib/messageUpload.ts
      - convex/channelThreads.test.ts
      - apps/web/src/features/workspace/chat/message-send-retry.ts
      - apps/web/src/features/workspace/chat/message-send-retry.test.ts
      - apps/mobile/src/lib/attachment-upload.ts
    evidence:
      - kind: prior_assessment
        from: [REL-02, REL-06]

