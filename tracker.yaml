# One editable outcome tracker; theory.md owns intent and design.md owns presentation.
# Kaadr schema 7: working / planned / in_progress / blocked / unknown.
# Areas: groups, conversation, notifications, platform, release.
schema_version: 7
principle: >-
  Describe observable behavior, not a file inventory or a percentage complete. Priority is the
  order of remaining work: P0 first, P1 next, P2 later. Working means the stated scope is
  implemented, not that every interaction or deployment has been verified. Missing check
  reports do not establish product defects. Keep uncertainty explicit and evidence scoped.
sizing: >-
  Estimate remaining work, not elapsed time. S: one focused change. M: several connected
  changes. L: substantial cross-cutting work; split before starting. Unknown: investigate
  before sizing. Working entries have no remaining work to size. Waiting does not increase
  size. Revisit estimates when the work is inspected.
outcomes:
  - id: conversation.quote_replies_only
    title: Replies quote a message, without side threads
    area: conversation
    state: planned
    priority: P0
    size: M
    size_reason: Quote replies already exist; the work is removing threads and checking the jump to old messages.
    summary: >-
      Both apps can already reply by quoting a message. Side threads still exist next to that, with
      their own pages, followers and read state.
    remaining:
      - Delete side threads, their followers and read state, and their screens in both apps.
      - Make sure tapping a quote jumps to the original message even when it is outside the loaded page.
    theory: theory.md#messages
    code:
      - convex/channelThreads.ts
      - apps/mobile/src/app/conversation.tsx

  - id: groups.remove_company_collaboration
    title: Remove companies, relationships and exit archives
    area: groups
    state: planned
    priority: P0
    size: L
    size_reason: Company rules run through membership, navigation and search in both apps.
    summary: >-
      Companies, relationship types, Project ownership transfer and frozen exit archives are still
      implemented. In Q9 Chat, people from another company are ordinary group members.
    remaining:
      - Delete company, relationship, ownership, exit and archive code, tables and screens.
      - Keep every person's existing group access while the company layer goes.
    theory: theory.md#groups
    code:
      - convex/companies.ts
      - convex/projectExit.ts

  - id: groups.groups_without_projects
    title: Groups are the only container
    area: groups
    state: planned
    priority: P0
    size: L
    size_reason: Project IDs key groups, members, messages, invitations and search indexes.
    summary: >-
      Groups live inside Projects today, and Project membership gates group access. A two-person
      conversation is not yet a group of two.
    remaining:
      - Move membership, invitations, search and notifications from Projects onto groups, then remove Projects.
      - Let a person start a group of two from someone's name.
      - Plan the production data move; it needs Hasan's approval before it runs.
    theory: theory.md#groups
    code:
