# One editable outcome tracker; theory.md owns intent and design.md owns presentation.
# Kaadr schema 7: working / planned / in_progress / blocked / unknown.
# Areas: platform, collaboration, conversation, tasks, assistant, release.
schema_version: 7
principle: >-
  Describe observable behavior, not a file inventory or a percentage complete. Priority is the
  order of remaining work: P0 first, P1 next, P2 later. Working means the stated scope is
  implemented, not that every interaction or deployment has been verified. Missing check
  reports do not establish product defects. Keep uncertainty explicit and evidence scoped.
sizing: >-
  Estimate remaining work, not elapsed time. S: one focused change. M: several connected
  changes. L: substantial cross-cutting work; split before starting. Unknown: investigate
  before sizing. Working entries have no remaining work to size. Waiting does not increase
  size. Revisit estimates when the work is inspected.
outcomes:
  - id: collaboration.explicit_project_ownership
    title: Companies share Projects without silently assigning ownership or expanding access
    area: collaboration
    state: working
    summary: >-
      Internal Projects have an owning Company and can add collaborators. Existing ownership
      assignments require revision-bound participant confirmation; Company selection does not
      assign legacy Projects. Represented membership remains explicit in navigation and queries.
    theory: theory.md#companies-and-projects
    code:
      - convex/projectOwnership.ts
      - convex/companyRelationships.test.ts
      - packages/shared/src/company.ts
      - packages/shared/src/company.test.ts
      - apps/web/src/features/company/company-query-scope.test.ts

  - id: collaboration.immutable_exit_history
    title: An exiting Company keeps only its permitted frozen Project history
    area: collaboration
    state: working
    summary: >-
      Capture, finalization, and cleanup use bounded work. Capture pauses writes but keeps reads
      available; failed captures can resume or cancel. Archived readers preserve each member's
      Channel scope and use indexed pages. Existing deployment backfill status is separate below.
    theory: theory.md#leaving-a-project
    code:
      - convex/lib/projectExitCapture.ts
      - convex/lib/projectExitArchive.ts
      - convex/lib/projectSnapshotLock.ts
      - convex/projectSnapshotLock.test.ts
      - convex/companyRelationships.test.ts
    evidence:
      - kind: prior_assessment
        from: [PERF-04, PERF-05]
        detail: Implemented scope migrated from the approved September 2026 audit, not a new scale benchmark.

  - id: collaboration.existing_archive_search_migration
    title: Existing exit archives remain searchable after the indexed-reader upgrade
    area: collaboration
    state: unknown
    priority: P1
    size: Unknown
    size_reason: Inventory existing archive cohorts and migration completion before estimating remaining work.
    summary: >-
      Indexed readers and resumable backfill jobs exist. Source alone does not establish whether
      every configured deployment's older archives have been migrated.
    uncertainty: >-
      This documentation pass did not access production or verify migration completion. Do not
      infer missing records or a deployed search defect from that lack of observation.
    remaining:
      - Confirm which existing archive scopes need the backfill before relying on indexed search.
      - >-
        In an approved migration window, run
        internal.taskArchiveMaintenance.backfillArchiveSearchFields for each existing
        projectArchiveEntitlements ID and
        internal.taskArchiveMaintenance.backfillExitSnapshotSearchFields for each existing
        (projectCompanyId, operationId) staging scope. Each job schedules its next page and
        supports resuming with the last cursor. Verify search before marking this outcome working.
    theory: theory.md#leaving-a-project
    code:
      - convex/taskArchiveMaintenance.ts
      - convex/lib/archivedProjectSearch.ts

